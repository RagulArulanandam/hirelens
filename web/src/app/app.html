@if (auth.isLoggedIn()) {
  <header class="topbar">
    <a routerLink="/" class="brand" aria-label="HireLens home"><hl-logo [size]="34" /></a>
    <nav>
      <a routerLink="/analyses/new" routerLinkActive="active">New analysis</a>
      <a routerLink="/history" routerLinkActive="active">History</a>
      @if (auth.isAdmin()) { <a routerLink="/admin" routerLinkActive="active">Admin</a> }
    </nav>
    <span class="grow"></span>
    <button class="icon" (click)="theme.toggle()" [attr.aria-label]="'Switch to ' + (theme.theme() === 'dark' ? 'light' : 'dark') + ' mode'" title="Toggle dark mode">
      {{ theme.theme() === 'dark' ? '☀' : '☾' }}
    </button>
    <span class="user">{{ auth.user()?.fullName || auth.user()?.email }}</span>
    <button class="btn ghost sm" (click)="auth.logout()">Sign out</button>
  </header>
}
<main><router-outlet /></main>
@if (toast.message(); as m) { <div class="toast" role="alert">{{ m }}</div> }
